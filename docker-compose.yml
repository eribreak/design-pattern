version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: design_patterns_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: design_patterns
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - design_patterns_db:/var/lib/postgresql/data

volumes:
  design_patterns_db: